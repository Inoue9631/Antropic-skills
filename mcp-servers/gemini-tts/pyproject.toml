[project]
name = "gemini-tts-mcp"
version = "0.1.0"
description = "Servidor MCP que converte texto em fala (TTS) com os modelos de voz do Gemini, para uso no Claude Desktop e no Claude Code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "google-genai>=2.33",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
gemini-tts-mcp = "gemini_tts_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_tts_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
